version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: merchant_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: merchant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: merchant_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides the localhost URL in .env so Docker uses the internal network name 'db'
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/merchant_db
    depends_on:
      - db

  adminer:
    image: adminer:latest
    container_name: merchant_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: